<style>.display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', Arial, sans-serif; }.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }.blink { animation: blink 1.1s steps(1) infinite; }@keyframes blink { 50% { opacity: 0; } }@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }</style>
